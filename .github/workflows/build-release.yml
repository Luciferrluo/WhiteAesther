name: build, test and release

# A push to a branch with an open pull request matches `pull_request` and `push`
# both, so every commit on every branch was built twice — three platforms each,
# around thirteen minutes a job. `pull_request` covers branches; `push` is left
# with the two refs that actually publish something.
on:
  pull_request:
  push:
    # Merging a version bump is what publishes. Requiring a tag afterwards left
    # a gap where the work was merged but not released, and the tag then started
    # a second full build of a tree that had just been built -- so the release
    # was always one more errand and one more wait after it looked finished.
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whiteaesther-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The fork adds the reporting modes the endpoint scanner needs. Pinned to a
  # tag rather than a branch so a release is reproducible.
  AETHER_REVISION: v1.5.0-whiteaesther.3

jobs:
  gate:
    name: Decide whether this publishes
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Seconds, not minutes. A merge that does not change the version does no
      # building at all, so ordinary merges stay free.
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          publish=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            publish=true
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            # The released versions are the record of what has shipped, so the
            # question "is this new" needs no extra state to answer.
            if gh release view "v${version}" >/dev/null 2>&1; then
              echo "v${version} is already released; this merge changes nothing to publish"
            else
              publish=true
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "version ${version}, publish ${publish}"

  package:
    name: ${{ matrix.name }}
    needs: gate
    # Pull requests always build: bundling is where packaging problems show up,
    # and the missing xdg-open on arm64 would otherwise have surfaced during a
    # release instead of before one.
    if: >-
      github.event_name != 'push' || needs.gate.outputs.publish == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # One naming scheme everywhere: x86_64 and arm64. The bundlers disagree
          # with each other -- the same machine is x64 to NSIS, amd64 to dpkg and
          # x86_64 to rpm -- so the release job renames every asset before
          # publishing rather than making people work out which is which.
          - os: windows-latest
            name: Windows x86_64
            artifact: windows-x86_64
            core: aether.exe
            bundles: nsis,msi
            packages: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            name: macOS arm64
            artifact: macos-arm64
            core: aether
            bundles: dmg
            packages: src-tauri/target/release/bundle/dmg/*.dmg
          # Every Mac sold before late 2020. macos-15-intel is the current Intel
          # image; the macos-13 that used to fill this role has been retired.
          - os: macos-15-intel
            name: macOS x86_64
            artifact: macos-x86_64
            core: aether
            bundles: dmg
            packages: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: Linux x86_64
            artifact: linux-x86_64
            core: aether
            bundles: deb,rpm,appimage
            packages: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: ubuntu-22.04-arm
            name: Linux arm64
            artifact: linux-arm64
            core: aether
            bundles: deb,rpm,appimage
            packages: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out WhiteAesther
        uses: actions/checkout@v7

      - name: Check out the pinned Aether core
        uses: actions/checkout@v7
        with:
          repository: WhiteDNS/Aether
          ref: ${{ env.AETHER_REVISION }}
          path: aether-core

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
          libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          cmake ninja-build perl pkg-config clang rpm xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # 24 for the test runner: the unit tests are TypeScript, and Node only
          # strips types without a flag from 22.18 onward. Pinning the major
          # keeps that from depending on which 22.x the runner happens to have.
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set the visible build version
        shell: bash
        run: |
          base_version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA:0:7}"

          # Anything being published shows the plain version. Anything else is
          # marked as the branch build it is, so a test build can never be
          # mistaken for a release in a bug report.
          if [[ "${{ needs.gate.outputs.publish }}" == "true" ]]; then
            visible_version="${base_version}"
          else
            branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            branch="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^0-9a-z]+/-/g; s/^-+|-+$//g')"
            visible_version="${base_version}-${branch}.${GITHUB_RUN_NUMBER}+${short_sha}"
          fi

          echo "VITE_APP_VERSION=${visible_version}" >> "$GITHUB_ENV"
          echo "WhiteAesther UI version: ${visible_version}"

      - name: Compile the frontend
        run: pnpm build

      - name: Test the frontend
        run: pnpm test

      - name: Compile the Aether core
        run: cargo build --release --locked --manifest-path aether-core/aether/Cargo.toml

      - name: Stage the target-specific Aether sidecar
        run: pnpm stage:core -- --source "${{ github.workspace }}/aether-core/aether/target/release/${{ matrix.core }}"

      - name: Test the Tauri backend
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Build the desktop package
        run: pnpm tauri build --bundles "${{ matrix.bundles }}"

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: whiteaesther-${{ matrix.artifact }}
          path: ${{ matrix.packages }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [gate, package]
    # workflow_dispatch still builds and uploads artifacts, so the packages can
    # be checked by hand without creating a release.
    if: needs.gate.outputs.publish == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten package directories
        shell: bash
        run: |
          set -euo pipefail

          # Counted rather than asserted against a fixed number. A hardcoded
          # total has to be remembered every time the build matrix changes, and
          # the one thing that actually matters here is that flattening did not
          # let two packages with the same name overwrite each other. Comparing
          # before with after checks exactly that, and keeps checking it however
          # many architectures are added later.
          before="$(find release-assets -type f | wc -l)"
          test "${before}" -gt 0 || { echo "no packages were built" >&2; exit 1; }

          mkdir flattened-assets
          while IFS= read -r -d '' package; do
            cp -- "$package" "flattened-assets/$(basename "$package")"
          done < <(find release-assets -type f -print0)
          rm -rf release-assets
          mv flattened-assets release-assets

          after="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [ "${before}" -ne "${after}" ]; then
            echo "${before} packages went in and ${after} came out: two of them share a name" >&2
            exit 1
          fi
          echo "${after} packages"

      - name: Give every package the same naming scheme
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          expected="$(find . -maxdepth 1 -type f | wc -l)"
          version="${{ needs.gate.outputs.version }}"

          # Each bundler names the same machine differently: x64, amd64 and
          # x86_64 are one architecture, aarch64 and arm64 are another. Someone
          # choosing a download should not have to know that, so everything is
          # rewritten to WhiteAesther_<version>_<os>_<arch>.<ext>.
          # Matched on how each file ends rather than on an exact name, so a
          # bundler spelling an architecture differently renames correctly
          # instead of failing a release over a filename. Anything unrecognised
          # still stops the job: publishing a package we cannot name is worse
          # than publishing nothing.
          for asset in *; do
            case "$asset" in
              *aarch64-setup.exe|*arm64-setup.exe)   named="windows_arm64.exe" ;;
              *-setup.exe)                           named="windows_x86_64.exe" ;;
              *arm64*.msi|*aarch64*.msi)             named="windows_arm64.msi" ;;
              *.msi)                                 named="windows_x86_64.msi" ;;
              *aarch64.dmg|*arm64.dmg)               named="macos_arm64.dmg" ;;
              *.dmg)                                 named="macos_x86_64.dmg" ;;
              *aarch64.deb|*arm64.deb)               named="linux_arm64.deb" ;;
              *.deb)                                 named="linux_x86_64.deb" ;;
              *aarch64.rpm|*arm64.rpm)               named="linux_arm64.rpm" ;;
              *.rpm)                                 named="linux_x86_64.rpm" ;;
              *aarch64.AppImage|*arm64.AppImage)     named="linux_arm64.AppImage" ;;
              *.AppImage)                            named="linux_x86_64.AppImage" ;;
              *) echo "unrecognised package, refusing to publish it: $asset" >&2; exit 1 ;;
            esac
            mv -- "$asset" "WhiteAesther_${version}_${named}"
          done

          # Renaming collapses names, so two packages could collide here even
          # though they did not before. Same check, same reasoning, no total to
          # keep up to date.
          renamed="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "${renamed}" -ne "${expected}" ]; then
            echo "renaming turned ${expected} packages into ${renamed}" >&2
            exit 1
          fi
          echo "Published assets:"
          ls -1

      - name: Create installer pack and SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          zip -9 WhiteAesther-installers.zip \
            ./*.exe ./*.msi ./*.dmg ./*.deb ./*.rpm ./*.AppImage
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="v${{ needs.gate.outputs.version }}"

          # --target creates the tag at this commit when it does not exist yet,
          # which is what makes merging the release: no separate tag to push
          # afterwards, and so no window where the work is merged but the
          # release is still missing.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --title "WhiteAesther $tag"
          fi
          echo "Released $tag from ${GITHUB_SHA}"
          gh release view "$tag" --json url --jq .url
