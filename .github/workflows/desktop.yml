name: desktop packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            core: aether.exe
            bundles: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: macos
            core: aether
            bundles: dmg
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: linux-x64
            core: aether
            bundles: deb,appimage
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MatinSenPai/Aether
          ref: 21b9872d080bd185600b93ff20b87f3f3e1e7307
          path: aether-core
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          build-essential cmake ninja-build perl pkg-config clang
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: pnpm install --frozen-lockfile
      - run: cargo build --release --locked --manifest-path aether-core/aether/Cargo.toml
      - run: pnpm stage:core -- --source "${{ github.workspace }}/aether-core/aether/target/release/${{ matrix.core }}"
      - run: pnpm tauri build --bundles "${{ matrix.bundles }}"
      - uses: actions/upload-artifact@v4
        with:
          name: whiteaesther-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
